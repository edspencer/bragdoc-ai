# TEMPORARY (PR30): diagnose the macOS instructions-watch flake under load. Removed before the PR is ready.
name: stress-tmp
on:
  push:
    branches: [v02/30-release-candidate]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: the diagnostic beside the full suite (load)
        shell: bash
        run: |
          set +e +o pipefail
          for i in 1 2 3; do
            (npm test > suite-$i.txt 2>&1 &)
            DIAG_N=25 node --import tsx test/zz-diag.stress.ts 2>&1 | tail -c 20000
            wait
            sleep 20
          done
          exit 0
