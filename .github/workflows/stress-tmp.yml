# TEMPORARY (PR30): verify the macOS instructions-watch hardening under the full suite. Removed before the PR is ready.
name: stress-tmp
on:
  push:
    branches: [v02/30-release-candidate]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: the full suite, 4 times
        shell: bash
        run: |
          set +e +o pipefail
          watch=0; other=0
          for i in 1 2 3 4; do
            npm test > out.txt 2>&1
            grep -E '^# (pass|fail) ' out.txt
            if grep -qE '^not ok .*(hand edit is picked up live|hand-made ai/ folder)' out.txt; then watch=$((watch+1)); grep -A12 '^not ok .*hand' out.txt | head -14; fi
            if grep -E '^not ok' out.txt | grep -vqE 'hand edit is picked up live|hand-made ai/ folder'; then other=$((other+1)); grep -E '^not ok' out.txt; fi
          done
          echo "shard ${{ matrix.shard }}: instructions-watch failures=$watch/4, runs with other failures=$other/4" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
